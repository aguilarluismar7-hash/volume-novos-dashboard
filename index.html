<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise de Fornecedores | Grupo Raviera</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<link rel="stylesheet" href="/shared.css">
<style>
  .wrap{max-width:1180px;margin:0 auto;}
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:22px;
  }
  h1{
    font-size:1.55rem;
    font-weight:700;
    margin:0 0 4px;
    color:var(--navy);
    letter-spacing:-0.01em;
  }
  .subtitle{color:var(--muted);font-size:0.92rem;}
  .status{
    text-align:right;
    font-size:0.78rem;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  #refreshBtn{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:7px 14px;
    border-radius:7px;
    font-size:0.8rem;
    cursor:pointer;
    font-weight:600;
  }
  #refreshBtn:hover{background:var(--navy-2);}
  #refreshBtn:disabled{opacity:0.6;cursor:default;}

  .filters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:22px;
  }
  .filter label{
    display:block;
    font-size:0.7rem;
    font-weight:700;
    letter-spacing:0.04em;
    color:var(--slate);
    margin-bottom:5px;
    text-transform:uppercase;
  }
  .filter select, .filter input{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    font-size:0.9rem;
    color:var(--text);
  }

  .kpi-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 20px;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
    opacity:0;
    animation:fadeInUp 0.45s ease forwards;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(15,36,64,0.08);
  }
  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .kpi-value{
    font-size:1.7rem;
    font-weight:700;
    color:var(--navy);
    line-height:1;
    transition:color 0.2s ease;
  }
  .kpi-label{
    font-size:0.7rem;
    font-weight:700;
    letter-spacing:0.04em;
    color:var(--slate);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .kpi-value.red{color:var(--red);}
  .kpi-value.green{color:var(--green);}
  .kpi-sub{margin-top:6px;font-size:0.8rem;color:var(--muted);}

  section.block{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px 22px;
    margin-bottom:16px;
  }
  .block h2{
    font-size:0.98rem;
    font-weight:700;
    color:var(--navy);
    margin:0 0 14px;
  }
  table.monthly{
    width:100%;
    border-collapse:collapse;
    font-size:0.83rem;
  }
  table.monthly th, table.monthly td{
    padding:8px 6px;
    text-align:right;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  table.monthly th:first-child, table.monthly td:first-child{
    text-align:left;
    min-width:200px;
    color:var(--slate);
    font-weight:600;
  }
  table.monthly thead th{
    color:var(--muted);
    font-weight:700;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.03em;
    text-align:center;
  }
  table.monthly td.total, table.monthly th.total{
    font-weight:700;
    color:var(--navy);
    border-left:2px solid var(--border);
  }
  table.monthly tbody tr:last-child td{border-bottom:none;}
  table.monthly tbody tr.fornecedor-row{cursor:pointer;}
  table.monthly tbody tr.fornecedor-row:hover{background:#f7f9fb;}
  table.monthly tbody tr.fornecedor-row.aberto{background:#eef2f7;}
  td.dash{color:var(--slate-light);}
  .badge{
    display:inline-block;
    padding:2px 8px;
    border-radius:20px;
    font-size:0.72rem;
    font-weight:600;
    background:#eef2f7;
    color:var(--navy);
  }
  .badge.alerta{background:#fbeae7;color:var(--red);}
  .drill-wrap{
    margin:0 0 10px 0;
    padding:14px 16px;
    background:#fafbfc;
    border:1px solid var(--border);
    border-radius:10px;
  }
  .drill-wrap table.monthly{font-size:0.78rem;}
  .drill-close{
    font-size:0.75rem;
    color:var(--muted);
    cursor:pointer;
    text-decoration:underline;
  }

  .charts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .chart-box{position:relative; height:320px;}

  .note{font-size:0.78rem;color:var(--muted);margin-top:10px;line-height:1.5;}
  .loading, .error{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .error{color:var(--red);}
  @media (max-width:900px){
    .filters{grid-template-columns:repeat(2,1fr);}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .charts{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<nav class="sidebar" id="sidebar-root"></nav>
<script src="/sidebar.js"></script>
<div class="main">
<div class="wrap">
  <header>
    <div style="display:flex; align-items:center; gap:14px;">
      <h1>Análise de Fornecedores</h1>
    </div>
    <div class="status">
      <span id="lastUpdated">Carregando…</span>
      <button id="refreshBtn" onclick="loadAll()">Atualizar dados</button>
    </div>
  </header>

  <div class="filters">
    <div class="filter">
      <label>Categoria</label>
      <select id="fCategoria"><option value="Todas">Todas</option></select>
    </div>
    <div class="filter">
      <label>Ano</label>
      <select id="fAno">
        <option value="Todos">Todos</option>
        <option value="2025">2025</option>
        <option value="2026">2026</option>
      </select>
    </div>
    <div class="filter">
      <label>Conta Contábil</label>
      <select id="fConta"><option value="Todas">Todas</option></select>
    </div>
    <div class="filter">
      <label>Buscar Fornecedor</label>
      <input type="text" id="fBusca" placeholder="Nome do fornecedor…">
    </div>
  </div>

  <div id="content">
    <div class="loading">Carregando dados da planilha…</div>
  </div>
</div>
</div>

<script>
let rawRows = [];      // linhas de detalhe de NF já limpas: {fornecedor, cnpj, categoria, conta, nf, data, ano, valor}
let resumoData = [];   // agregado por fornecedor
let charts = {categoria:null, ranking:null};
let linhaAberta = null;

function csvUrl(sheetName){
  return `/api/sheet?tab=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
}

// Parser de CSV que lida com campos entre aspas contendo vírgulas
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
}

async function fetchSheet(name){
  const res = await fetch(csvUrl(name), { cache: 'no-store' });
  if(!res.ok) throw new Error(`Não consegui ler a aba "${name}" (status ${res.status})`);
  const text = await res.text();
  return parseCSV(text);
}

function toNumber(v){
  if(v === undefined || v === null || v === '') return null;
  const s = String(v).trim();
  if(s === '') return null;
  const n = parseFloat(s.replace(/\./g,'').replace(',','.'));
  return isNaN(n) ? null : n;
}

// Tenta ler datas tanto no formato dd/mm/aaaa (Excel/BR) quanto aaaa-mm-dd (ISO)
function parseDateBR(v){
  if(!v) return null;
  const s = String(v).trim();
  if(!s) return null;
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function findCol(headerRow, candidates, posicaoFallback){
  const norm = h => (h||'').trim().toLowerCase();
  for(const cand of candidates){
    const idx = headerRow.findIndex(h => norm(h) === norm(cand));
    if(idx !== -1) return idx;
  }
  // Fallback: o Google Sheets (gviz/CSV) às vezes retorna o cabeçalho em branco
  // para colunas com números grandes ou datas, mesmo a célula estando preenchida.
  // Nesse caso, usamos a posição fixa esperada (0-based) como último recurso.
  if(posicaoFallback !== undefined && posicaoFallback < headerRow.length) return posicaoFallback;
  return -1;
}

async function loadAll(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = 'Atualizando…';
  document.getElementById('content').innerHTML = '<div class="loading">Carregando dados da planilha…</div>';

  if(typeof Chart === 'undefined'){
    document.getElementById('content').innerHTML =
      '<div class="error">A biblioteca de gráficos (Chart.js) não carregou. Verifique sua conexão ou se o CDN está sendo bloqueado, e recarregue a página.</div>';
    btn.disabled = false;
    btn.textContent = 'Atualizar dados';
    return;
  }

  try{
    const rows = await fetchSheet('TabFornecedores');
    const header = rows[0] || [];

    const idx = {
      fornecedor: findCol(header, ['Fornecedor'], 0),
      cnpjBruto: findCol(header, ['FORNECEDOR_CNPJ'], 1),
      cnpjAjustado: findCol(header, ['Fornecedor Ajustado','CNPJ Ajustado'], 2),
      categoria: findCol(header, ['Categorias','Categoria'], 3),
      conta: findCol(header, ['CONTA_CONTABIL_DESCRICAO','Conta_Contabil'], 4),
      nf: findCol(header, ['NUMERO_NOTA','Numero_Nota'], 5),
      data: findCol(header, ['DATA_ENTRADA mais recente','Data'], 6),
      v2025: findCol(header, ['2025'], 7),
      v2026: findCol(header, ['2026'], 8),
    };

    if(idx.fornecedor === -1 || idx.nf === -1){
      throw new Error('Não encontrei as colunas essenciais (Fornecedor, NUMERO_NOTA) na aba TabFornecedores. Cabeçalho lido: ' + header.join(' | '));
    }

    const cnpjIdxPreferido = idx.cnpjAjustado !== -1 ? idx.cnpjAjustado : idx.cnpjBruto;

    rawRows = rows.slice(1)
      .map(r => {
        const fornecedor = (r[idx.fornecedor]||'').trim();
        const cnpjRaw = (r[cnpjIdxPreferido]||'').trim();
        const conta = idx.conta !== -1 ? (r[idx.conta]||'').trim() : '';
        const nfRaw = idx.nf !== -1 ? (r[idx.nf]||'').trim() : '';
        const v25 = idx.v2025 !== -1 ? toNumber(r[idx.v2025]) : null;
        const v26 = idx.v2026 !== -1 ? toNumber(r[idx.v2026]) : null;
        const dataStr = idx.data !== -1 ? r[idx.data] : '';
        const dataObj = parseDateBR(dataStr);
        return {
          fornecedor,
          cnpj: cnpjRaw.padStart(14,'0'),
          categoria: idx.categoria !== -1 ? (r[idx.categoria]||'').trim() : '',
          conta,
          nf: nfRaw,
          data: dataObj,
          valor: v25 !== null ? v25 : v26,
          ano: dataObj ? dataObj.getFullYear() : (v25 !== null ? 2025 : (v26 !== null ? 2026 : null)),
        };
      })
      // Remove linhas de subtotal, rodapé e linha em branco
      .filter(r => r.fornecedor && r.fornecedor !== 'Total')
      .filter(r => !r.fornecedor.toLowerCase().includes('filtros aplicados'))
      .filter(r => r.cnpj !== '00000000000000' && r.cnpj !== 'total'.padStart(14,'0'))
      .filter(r => r.conta !== 'Total')
      .filter(r => r.nf && r.nf !== 'Total')
      .filter(r => r.valor !== null);

    buildResumo();
    buildFilters();
    render();

    document.getElementById('lastUpdated').textContent =
      'Atualizado em ' + new Date().toLocaleString('pt-BR');
  } catch(err){
    document.getElementById('content').innerHTML =
      `<div class="error">Não consegui carregar os dados da planilha.<br>${err.message}<br><br>
      Verifique se o Google Sheets está compartilhado como "Qualquer pessoa com o link — Leitor".</div>`;
    document.getElementById('lastUpdated').textContent = 'Falha ao atualizar';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Atualizar dados';
  }
}

function buildResumo(){
  const map = {};
  rawRows.forEach(r => {
    const key = r.cnpj;
    if(!map[key]){
      map[key] = {
        fornecedor: r.fornecedor,
        cnpj: r.cnpj,
        categoria: r.categoria,
        valorTotal: 0,
        qtdNotas: new Set(),
        datas: [],
      };
    }
    map[key].valorTotal += r.valor;
    map[key].qtdNotas.add(r.nf);
    if(r.data) map[key].datas.push(r.data);
  });

  resumoData = Object.values(map).map(f => {
    const qtd = f.qtdNotas.size;
    const ultimaCompra = f.datas.length ? new Date(Math.max(...f.datas.map(d=>d.getTime()))) : null;
    return {
      fornecedor: f.fornecedor,
      cnpj: f.cnpj,
      categoria: f.categoria,
      valorTotal: f.valorTotal,
      qtdNotas: qtd,
      ticketMedio: qtd ? f.valorTotal / qtd : 0,
      ultimaCompra,
    };
  }).sort((a,b) => b.valorTotal - a.valorTotal);
}

function buildFilters(){
  const catSel = document.getElementById('fCategoria');
  const contaSel = document.getElementById('fConta');
  const prevCat = catSel.value || 'Todas';
  const prevConta = contaSel.value || 'Todas';

  const categorias = [...new Set(rawRows.map(r => r.categoria).filter(Boolean))].sort();
  catSel.innerHTML = '<option value="Todas">Todas</option>' +
    categorias.map(c => `<option value="${c}">${c}</option>`).join('');
  catSel.value = categorias.includes(prevCat) ? prevCat : 'Todas';

  const contas = [...new Set(rawRows.map(r => r.conta).filter(Boolean))].sort();
  contaSel.innerHTML = '<option value="Todas">Todas</option>' +
    contas.map(c => `<option value="${c}">${c}</option>`).join('');
  contaSel.value = contas.includes(prevConta) ? prevConta : 'Todas';

  catSel.onchange = () => { linhaAberta = null; render(); };
  contaSel.onchange = () => { linhaAberta = null; render(); };
  document.getElementById('fAno').onchange = () => { linhaAberta = null; render(); };
  document.getElementById('fBusca').oninput = () => { linhaAberta = null; render(); };
}

function getFilters(){
  return {
    categoria: document.getElementById('fCategoria').value,
    ano: document.getElementById('fAno').value,
    conta: document.getElementById('fConta').value,
    busca: (document.getElementById('fBusca').value || '').trim().toLowerCase(),
  };
}

function matchesFilters(r, f){
  if(f.categoria !== 'Todas' && r.categoria !== f.categoria) return false;
  if(f.ano !== 'Todos' && String(r.ano) !== f.ano) return false;
  if(f.conta !== 'Todas' && r.conta !== f.conta) return false;
  return true;
}

function fmt(n){
  if(n === null || n === undefined || isNaN(n)) return '-';
  return n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function fmtDate(d){
  if(!d) return '-';
  return d.toLocaleDateString('pt-BR');
}

function render(){
  const f = getFilters();

  const rowsFiltradas = rawRows.filter(r => matchesFilters(r, f));

  // Recalcula resumo dentro do filtro ativo
  const map = {};
  rowsFiltradas.forEach(r => {
    if(!map[r.cnpj]){
      map[r.cnpj] = { fornecedor:r.fornecedor, cnpj:r.cnpj, categoria:r.categoria, valorTotal:0, qtdNotas:new Set(), datas:[] };
    }
    map[r.cnpj].valorTotal += r.valor;
    map[r.cnpj].qtdNotas.add(r.nf);
    if(r.data) map[r.cnpj].datas.push(r.data);
  });

  let resumoFiltrado = Object.values(map).map(x => {
    const qtd = x.qtdNotas.size;
    const ultimaCompra = x.datas.length ? new Date(Math.max(...x.datas.map(d=>d.getTime()))) : null;
    return {
      fornecedor: x.fornecedor, cnpj: x.cnpj, categoria: x.categoria,
      valorTotal: x.valorTotal, qtdNotas: qtd,
      ticketMedio: qtd ? x.valorTotal/qtd : 0,
      ultimaCompra,
    };
  }).sort((a,b) => b.valorTotal - a.valorTotal);

  if(f.busca){
    resumoFiltrado = resumoFiltrado.filter(r => r.fornecedor.toLowerCase().includes(f.busca));
  }

  // KPIs
  const valorTotalGeral = resumoFiltrado.reduce((s,r)=>s+r.valorTotal,0);
  const qtdFornecedores = resumoFiltrado.length;
  const qtdNotasGeral = resumoFiltrado.reduce((s,r)=>s+r.qtdNotas,0);
  const ticketMedioGeral = qtdNotasGeral ? valorTotalGeral/qtdNotasGeral : 0;

  let html = `<div class="kpi-row">
    <div class="card" style="animation-delay:0s">
      <div class="kpi-label">Valor Total</div>
      <div class="kpi-value">R$ ${fmt(valorTotalGeral)}</div>
      <div class="kpi-sub">com os filtros ativos</div>
    </div>
    <div class="card" style="animation-delay:0.08s">
      <div class="kpi-label">Fornecedores</div>
      <div class="kpi-value">${qtdFornecedores}</div>
      <div class="kpi-sub">CNPJs únicos</div>
    </div>
    <div class="card" style="animation-delay:0.16s">
      <div class="kpi-label">Notas Fiscais</div>
      <div class="kpi-value">${qtdNotasGeral}</div>
      <div class="kpi-sub">no período filtrado</div>
    </div>
    <div class="card" style="animation-delay:0.24s">
      <div class="kpi-label">Ticket Médio</div>
      <div class="kpi-value">R$ ${fmt(ticketMedioGeral)}</div>
      <div class="kpi-sub">por nota fiscal</div>
    </div>
  </div>`;

  // Tabela de ranking
  let tableRows = '';
  resumoFiltrado.forEach((r, i) => {
    const rowId = `row-${i}`;
    const aberta = linhaAberta === r.cnpj;
    tableRows += `<tr class="fornecedor-row${aberta?' aberto':''}" onclick="toggleDrill('${r.cnpj}')">
      <td>${r.fornecedor}</td>
      <td><span class="badge">${r.categoria || '—'}</span></td>
      <td>${r.qtdNotas}</td>
      <td>R$ ${fmt(r.ticketMedio)}</td>
      <td>${fmtDate(r.ultimaCompra)}</td>
      <td class="total">R$ ${fmt(r.valorTotal)}</td>
    </tr>`;
    if(aberta){
      tableRows += `<tr><td colspan="6" style="padding:0; border-bottom:none;">${buildDrillHtml(r.cnpj, f)}</td></tr>`;
    }
  });

  html += `<section class="block">
    <h2>Ranking de Fornecedores <span class="note" style="display:inline;">(clique numa linha para ver as notas)</span></h2>
    <div style="overflow-x:auto;">
    <table class="monthly">
      <thead><tr><th>Fornecedor</th><th>Categoria</th><th>Qtd Notas</th><th>Ticket Médio</th><th>Última Compra</th><th class="total">Valor Total</th></tr></thead>
      <tbody>${tableRows || '<tr><td colspan="6" style="text-align:center;">Nenhum fornecedor encontrado com esses filtros.</td></tr>'}</tbody>
    </table>
    </div>
  </section>`;

  html += `<div class="charts">
    <div class="block">
      <h2>Valor por Categoria</h2>
      <div class="chart-box"><canvas id="chartCategoria"></canvas></div>
    </div>
    <div class="block">
      <h2>Top 10 Fornecedores por Valor</h2>
      <div class="chart-box"><canvas id="chartRanking"></canvas></div>
    </div>
  </div>`;

  document.getElementById('content').innerHTML = html;

  renderChartCategoria(resumoFiltrado);
  renderChartRanking(resumoFiltrado);
}

function buildDrillHtml(cnpj, f){
  const notas = rawRows
    .filter(r => r.cnpj === cnpj && matchesFilters(r, f))
    .sort((a,b) => (b.data?.getTime()||0) - (a.data?.getTime()||0));

  const rows = notas.map(n => `<tr>
      <td>${fmtDate(n.data)}</td>
      <td>${n.conta || '-'}</td>
      <td>${n.nf}</td>
      <td class="total">R$ ${fmt(n.valor)}</td>
    </tr>`).join('');

  return `<div class="drill-wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <strong style="color:var(--navy); font-size:0.85rem;">Notas fiscais — ${notas.length} encontrada(s)</strong>
      <span class="drill-close" onclick="event.stopPropagation(); linhaAberta=null; render();">Fechar</span>
    </div>
    <div style="max-height:320px; overflow-y:auto;">
    <table class="monthly">
      <thead><tr><th>Data</th><th>Conta Contábil</th><th>Nº NF</th><th class="total">Valor</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" style="text-align:center;">Sem notas nesse filtro.</td></tr>'}</tbody>
    </table>
    </div>
  </div>`;
}

function toggleDrill(cnpj){
  linhaAberta = (linhaAberta === cnpj) ? null : cnpj;
  render();
}

function renderChartCategoria(resumo){
  const porCategoria = {};
  resumo.forEach(r => {
    const cat = r.categoria || 'Sem categoria';
    porCategoria[cat] = (porCategoria[cat]||0) + r.valorTotal;
  });
  const arr = Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]);

  const ctx = document.getElementById('chartCategoria');
  if(charts.categoria) charts.categoria.destroy();
  charts.categoria = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels: arr.map(a=>a[0]),
      datasets:[{ data: arr.map(a=>a[1]), backgroundColor:['#0f2440','#16345c','#1f8a5f','#c8442d','#d9a441','#6b7789','#8ca3c2','#a9425a','#3d7a6e'] }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'right', labels:{ boxWidth:12, font:{size:11} } } }
    }
  });
}

function renderChartRanking(resumo){
  const top10 = resumo.slice(0,10);
  const ctx = document.getElementById('chartRanking');
  if(charts.ranking) charts.ranking.destroy();
  charts.ranking = new Chart(ctx, {
    type:'bar',
    data:{
      labels: top10.map(r=>r.fornecedor.length>28 ? r.fornecedor.slice(0,28)+'…' : r.fornecedor),
      datasets:[{ data: top10.map(r=>r.valorTotal), backgroundColor:'#0f2440', borderRadius:4 }]
    },
    options:{
      indexAxis:'y',
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{ x:{ grid:{color:'#eef1f5'} }, y:{ grid:{display:false} } }
    }
  });
}

loadAll();
</script>
</body>
</html>
