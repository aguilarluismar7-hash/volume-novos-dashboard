<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise de Fornecedores | Grupo Raviera</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<link rel="stylesheet" href="/shared.css">
<style>
  .wrap{max-width:1180px;margin:0 auto;}
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:22px;
  }
  h1{
    font-size:1.55rem;
    font-weight:700;
    margin:0 0 4px;
    color:var(--navy);
    letter-spacing:-0.01em;
  }
  .subtitle{color:var(--muted);font-size:0.92rem;}
  .status{
    text-align:right;
    font-size:0.78rem;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  #refreshBtn{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:7px 14px;
    border-radius:7px;
    font-size:0.8rem;
    cursor:pointer;
    font-weight:600;
  }
  #refreshBtn:hover{background:var(--navy-2);}
  #refreshBtn:disabled{opacity:0.6;cursor:default;}

  .filters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:22px;
    position:sticky;
    top:0;
    z-index:5;
    background:var(--bg,#f4f6f9);
    padding:12px 0;
  }
  .filter label{
    display:block;
    font-size:0.7rem;
    font-weight:700;
    letter-spacing:0.04em;
    color:var(--slate);
    margin-bottom:5px;
    text-transform:uppercase;
  }
  .filter select, .filter input{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    font-size:0.9rem;
    color:var(--text);
  }

  .kpi-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 20px;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
    opacity:0;
    animation:fadeInUp 0.45s ease forwards;
    border-left:4px solid var(--border);
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(15,36,64,0.08);
  }
  .card.c-valor{border-left-color:#0f2440; background:linear-gradient(135deg,#ffffff 0%,#f3f6fa 100%);}
  .card.c-fornecedores{border-left-color:#1f8a5f; background:linear-gradient(135deg,#ffffff 0%,#f2f9f5 100%);}
  .card.c-notas{border-left-color:#d9a441; background:linear-gradient(135deg,#ffffff 0%,#fdf8ef 100%);}
  .card.c-ticket{border-left-color:#8ca3c2; background:linear-gradient(135deg,#ffffff 0%,#f4f7fa 100%);}
  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .kpi-icon-svg{
    width:20px;
    height:20px;
    margin-right:7px;
    vertical-align:-4px;
    stroke-width:2;
  }
  .kpi-value{
    font-size:1.5rem;
    font-weight:700;
    color:var(--navy);
    line-height:1.15;
    transition:color 0.2s ease;
    word-break:break-word;
    overflow-wrap:break-word;
  }
  .kpi-value.valor-grande{font-size:1.3rem;}
  .kpi-label{
    font-size:0.7rem;
    font-weight:700;
    letter-spacing:0.04em;
    color:var(--slate);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .kpi-value.red{color:var(--red);}
  .kpi-value.green{color:var(--green);}
  .kpi-sub{margin-top:6px;font-size:0.8rem;color:var(--muted);}

  section.block{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px 22px;
    margin-bottom:16px;
  }
  .block h2{
    font-size:0.98rem;
    font-weight:700;
    color:var(--navy);
    margin:0 0 14px;
  }
  .categoria-layout{
    display:grid;
    grid-template-columns:1.35fr 1fr;
    gap:18px;
    align-items:start;
  }
  .categoria-layout.full{
    grid-template-columns:1fr;
  }
  .ranking-layout{ display:block; }
  .ranking-layout .chart-box-cat{ margin-top:18px; height:340px; }
  .chart-box-cat{position:relative; height:360px;}
  .cat-dot{
    display:inline-block;
    width:9px; height:9px;
    border-radius:50%;
    margin-right:8px;
    vertical-align:middle;
  }
  .btn-mini{
    background:#fff;
    border:1px solid var(--border);
    color:var(--navy);
    padding:5px 12px;
    border-radius:7px;
    font-size:0.76rem;
    font-weight:600;
    cursor:pointer;
  }
  .btn-mini:hover{background:#f3f6fa;}

  table.monthly{
    width:100%;
    border-collapse:collapse;
    font-size:0.83rem;
  }
  table.monthly th, table.monthly td{
    padding:8px 6px;
    text-align:right;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  table.monthly th:first-child, table.monthly td:first-child{
    text-align:left;
    min-width:180px;
    color:var(--slate);
    font-weight:600;
  }
  table.monthly thead th{
    color:var(--muted);
    font-weight:700;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.03em;
    text-align:center;
  }
  table.monthly td.total, table.monthly th.total{
    font-weight:700;
    color:var(--navy);
    border-left:2px solid var(--border);
  }
  table.monthly tbody tr:last-child td{border-bottom:none;}
  table.monthly tbody tr.click-row{cursor:pointer;}
  table.monthly tbody tr.click-row:hover{background:#f7f9fb;}
  table.monthly tbody tr.click-row.aberto{background:#eef2f7;}
  td.dash{color:var(--slate-light);}
  .chevron{
    display:inline-block;
    margin-right:8px;
    transition:transform 0.15s ease;
    color:var(--slate);
    font-size:0.7rem;
  }
  .chevron.aberto{transform:rotate(90deg);}
  .badge{
    display:inline-block;
    padding:2px 8px;
    border-radius:20px;
    font-size:0.72rem;
    font-weight:600;
    background:#eef2f7;
    color:var(--navy);
  }
  .badge.alerta{
    background:#fbeae7;
    color:#c8442d;
    margin-left:6px;
  }
  .sub-block{
    margin:0 0 10px 0;
    padding:14px 16px;
    background:#fafbfc;
    border:1px solid var(--border);
    border-radius:10px;
  }
  .sub-block table.monthly{font-size:0.78rem;}
  .sub-close{
    font-size:0.75rem;
    color:var(--muted);
    cursor:pointer;
    text-decoration:underline;
  }

  .note{font-size:0.78rem;color:var(--muted);margin-top:10px;line-height:1.5;}
  .loading, .error{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .error{color:var(--red);}
  @media (max-width:900px){
    .filters{grid-template-columns:repeat(2,1fr);}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .categoria-layout{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<nav class="sidebar" id="sidebar-root"></nav>
<script src="/sidebar.js"></script>
<div class="main">
<div class="wrap">
  <header>
    <div style="display:flex; align-items:center; gap:14px;">
      <h1>Análise de Fornecedores</h1>
    </div>
    <div class="status">
      <span id="lastUpdated">Carregando…</span>
      <button id="refreshBtn" onclick="loadAll()">Atualizar dados</button>
    </div>
  </header>

  <div class="filters">
    <div class="filter">
      <label>Buscar Fornecedor</label>
      <input type="text" id="fBusca" list="listaFornecedores" placeholder="Digite ou escolha na lista…" autocomplete="off">
      <datalist id="listaFornecedores"></datalist>
    </div>
    <div class="filter">
      <label>Categoria</label>
      <select id="fCategoria"><option value="Todas">Todas</option></select>
    </div>
    <div class="filter">
      <label>Conta Contábil</label>
      <select id="fConta"><option value="Todas">Todas</option></select>
    </div>
    <div class="filter">
      <label>Ano</label>
      <select id="fAno">
        <option value="Todos">Todos</option>
        <option value="2025">2025</option>
        <option value="2026">2026</option>
      </select>
    </div>
  </div>

  <div id="content">
    <div class="loading">Carregando dados da planilha…</div>
  </div>
</div>
</div>

<script>
let rawRows = [];      // linhas de detalhe de NF já limpas: {fornecedor, categoria, conta, nf, data, ano, mes, valor}
let charts = {categoria:null, ranking:null};
let categoriasAbertas = new Set();
let fornecedorAberto = null;
let rankingAberto = null;
let dataReferencia = null; // maior data encontrada na base — usada para calcular "dias sem comprar"

const CORES_CATEGORIA = ['#0f2440','#16345c','#1f8a5f','#c8442d','#d9a441','#6b7789','#8ca3c2','#a9425a','#3d7a6e','#7a5c9e'];

function csvUrl(sheetName){
  return `/api/sheet?tab=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
}

async function fetchSheet(name){
  const res = await fetch(csvUrl(name), { cache: 'no-store' });
  if(!res.ok) throw new Error(`Não consegui ler a aba "${name}" (status ${res.status})`);
  const text = await res.text();
  return parseCSV(text);
}

function toNumber(v){
  if(v === undefined || v === null || v === '') return null;
  const s = String(v).trim();
  if(s === '') return null;
  const n = parseFloat(s.replace(/\./g,'').replace(',','.'));
  return isNaN(n) ? null : n;
}

// Lê datas em vários formatos possíveis vindos do Google Sheets/Excel:
// ISO (aaaa-mm-dd), BR/US (dd/mm/aaaa ou mm/dd/aaaa) e número de série de data
// (dias desde 30/12/1899, caso a célula tenha sido lida como número puro).
// Datas fora do intervalo plausível do negócio (2024-2027) são descartadas
// para não poluir "Última Compra" com anos aleatórios de má leitura.
function parseDateBR(v){
  if(v === undefined || v === null) return null;
  const s = String(v).trim();
  if(!s) return null;

  let d = null;

  if(/^\d{4,6}$/.test(s)){
    const serial = parseInt(s,10);
    if(serial > 20000 && serial < 60000){
      d = new Date(Date.UTC(1899,11,30) + serial*86400000);
    }
  }

  if(!d){
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m){ d = new Date(+m[1], +m[2]-1, +m[3]); }
  }

  if(!d){
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m){
      const a = +m[1], b = +m[2], y = +m[3];
      if(a > 12) d = new Date(y, b-1, a);          // a só pode ser dia
      else if(b > 12) d = new Date(y, a-1, b);      // b só pode ser dia
      else d = new Date(y, b-1, a);                 // ambíguo: assume dd/mm (padrão BR)
    }
  }

  if(!d){
    const tentativa = new Date(s);
    if(!isNaN(tentativa.getTime())) d = tentativa;
  }

  if(!d || isNaN(d.getTime())) return null;
  const ano = d.getFullYear();
  if(ano < 2024 || ano > 2027) return null; // descarta datas implausíveis (erro de leitura)
  return d;
}

function findCol(headerRow, candidates, posicaoFallback){
  const norm = h => (h||'').trim().toLowerCase();
  for(const cand of candidates){
    const idx = headerRow.findIndex(h => norm(h) === norm(cand));
    if(idx !== -1) return idx;
  }
  if(posicaoFallback !== undefined && posicaoFallback < headerRow.length) return posicaoFallback;
  return -1;
}

async function loadAll(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = 'Atualizando…';
  document.getElementById('content').innerHTML = '<div class="loading">Carregando dados da planilha…</div>';

  if(typeof Chart === 'undefined'){
    document.getElementById('content').innerHTML =
      '<div class="error">A biblioteca de gráficos (Chart.js) não carregou. Verifique sua conexão ou se o CDN está sendo bloqueado, e recarregue a página.</div>';
    btn.disabled = false;
    btn.textContent = 'Atualizar dados';
    return;
  }

  try{
    const rows = await fetchSheet('TabFornecedores');
    const header = rows[0] || [];

    const idx = {
      fornecedor: findCol(header, ['Fornecedor'], 0),
      cnpjBruto: findCol(header, ['FORNECEDOR_CNPJ'], 1),
      cnpjAjustado: findCol(header, ['Fornecedor Ajustado','CNPJ Ajustado'], 2),
      categoria: findCol(header, ['Categorias','Categoria'], 3),
      conta: findCol(header, ['CONTA_CONTABIL_DESCRICAO','Conta_Contabil'], 4),
      nf: findCol(header, ['NUMERO_NOTA','Numero_Nota'], 5),
      data: findCol(header, ['DATA_ENTRADA mais recente','Data'], 6),
      v2025: findCol(header, ['2025'], 7),
      v2026: findCol(header, ['2026'], 8),
    };

    if(idx.fornecedor === -1 || idx.nf === -1){
      throw new Error('Não encontrei as colunas essenciais (Fornecedor, NUMERO_NOTA) na aba TabFornecedores. Cabeçalho lido: ' + header.join(' | '));
    }

    rawRows = rows.slice(1)
      .map(r => {
        const fornecedor = (r[idx.fornecedor]||'').trim();
        const conta = idx.conta !== -1 ? (r[idx.conta]||'').trim() : '';
        const nfRaw = idx.nf !== -1 ? (r[idx.nf]||'').trim() : '';
        const v25 = idx.v2025 !== -1 ? toNumber(r[idx.v2025]) : null;
        const v26 = idx.v2026 !== -1 ? toNumber(r[idx.v2026]) : null;
        const dataStr = idx.data !== -1 ? r[idx.data] : '';
        const dataObj = parseDateBR(dataStr);
        const valor = v25 !== null ? v25 : v26;
        const ano = dataObj ? dataObj.getFullYear() : (v25 !== null ? 2025 : (v26 !== null ? 2026 : null));
        const mes = dataObj ? (dataObj.getMonth()+1) : null;
        return {
          fornecedor,
          categoria: idx.categoria !== -1 ? (r[idx.categoria]||'').trim() : '',
          conta,
          nf: nfRaw,
          data: dataObj,
          valor,
          ano,
          mes,
        };
      })
      .filter(r => r.fornecedor && r.fornecedor !== 'Total')
      .filter(r => !r.fornecedor.toLowerCase().includes('filtros aplicados'))
      .filter(r => r.conta !== 'Total')
      .filter(r => r.nf && r.nf !== 'Total')
      .filter(r => r.valor !== null);

    const todasAsDatas = rawRows.map(r => r.data).filter(Boolean);
    dataReferencia = todasAsDatas.length ? new Date(Math.max(...todasAsDatas.map(d=>d.getTime()))) : null;

    buildFilters();
    render();

    document.getElementById('lastUpdated').textContent =
      'Atualizado em ' + new Date().toLocaleString('pt-BR');
  } catch(err){
    document.getElementById('content').innerHTML =
      `<div class="error">Não consegui carregar os dados da planilha.<br>${err.message}<br><br>
      Verifique se o Google Sheets está compartilhado como "Qualquer pessoa com o link — Leitor".</div>`;
    document.getElementById('lastUpdated').textContent = 'Falha ao atualizar';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Atualizar dados';
  }
}

function buildFilters(){
  const catSel = document.getElementById('fCategoria');
  const contaSel = document.getElementById('fConta');
  const prevCat = catSel.value || 'Todas';
  const prevConta = contaSel.value || 'Todas';

  const categorias = [...new Set(rawRows.map(r => r.categoria).filter(Boolean))].sort();
  catSel.innerHTML = '<option value="Todas">Todas</option>' +
    categorias.map(c => `<option value="${c}">${c}</option>`).join('');
  catSel.value = categorias.includes(prevCat) ? prevCat : 'Todas';

  const contas = [...new Set(rawRows.map(r => r.conta).filter(Boolean))].sort();
  contaSel.innerHTML = '<option value="Todas">Todas</option>' +
    contas.map(c => `<option value="${c}">${c}</option>`).join('');
  contaSel.value = contas.includes(prevConta) ? prevConta : 'Todas';

  const nomesFornecedores = [...new Set(rawRows.map(r => r.fornecedor).filter(Boolean))].sort();
  document.getElementById('listaFornecedores').innerHTML =
    nomesFornecedores.map(n => `<option value="${n}">`).join('');

  catSel.onchange = () => { categoriasAbertas.clear(); fornecedorAberto=null; rankingAberto=null; render(); };
  contaSel.onchange = () => { categoriasAbertas.clear(); fornecedorAberto=null; rankingAberto=null; render(); };
  document.getElementById('fAno').onchange = () => { categoriasAbertas.clear(); fornecedorAberto=null; rankingAberto=null; render(); };
  document.getElementById('fBusca').oninput = () => { render(); };
}

function getFilters(){
  return {
    categoria: document.getElementById('fCategoria').value,
    ano: document.getElementById('fAno').value,
    conta: document.getElementById('fConta').value,
    busca: (document.getElementById('fBusca').value || '').trim().toLowerCase(),
  };
}

function matchesFilters(r, f){
  if(f.categoria !== 'Todas' && r.categoria !== f.categoria) return false;
  if(f.ano !== 'Todos' && String(r.ano) !== f.ano) return false;
  if(f.conta !== 'Todas' && r.conta !== f.conta) return false;
  return true;
}

function fmt(n){
  if(n === null || n === undefined || isNaN(n)) return '-';
  return n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function fmtDate(d){
  if(!d) return '-';
  return d.toLocaleDateString('pt-BR');
}

// Agrupa por NOME do fornecedor (não por CNPJ) — assim unidades com múltiplos
// CNPJs (matriz/filiais, ex: BMW do Brasil) aparecem consolidadas numa linha só.
function resumoPorFornecedor(rows){
  const map = {};
  rows.forEach(r => {
    if(!map[r.fornecedor]){
      map[r.fornecedor] = { fornecedor:r.fornecedor, categoria:r.categoria, valorTotal:0, qtdNotas:new Set(), datas:[], mesesComCompra:new Set() };
    }
    const m = map[r.fornecedor];
    m.valorTotal += r.valor;
    m.qtdNotas.add(r.nf);
    if(r.data) m.datas.push(r.data);
    if(r.ano && r.mes) m.mesesComCompra.add(r.ano+'-'+r.mes);
  });
  return Object.values(map).map(x => {
    const qtd = x.qtdNotas.size;
    const ultimaCompra = x.datas.length ? new Date(Math.max(...x.datas.map(d=>d.getTime()))) : null;
    const nMeses = x.mesesComCompra.size;
    return {
      fornecedor: x.fornecedor,
      categoria: x.categoria,
      valorTotal: x.valorTotal,
      qtdNotas: qtd,
      mediaMensal: nMeses ? x.valorTotal/nMeses : null,
      ultimaCompra,
    };
  }).sort((a,b) => b.valorTotal - a.valorTotal);
}

function resumoPorCategoria(rows){
  const map = {};
  rows.forEach(r => {
    const cat = r.categoria || 'Sem categoria';
    if(!map[cat]) map[cat] = { categoria:cat, valorTotal:0, fornecedores:new Set(), notas:new Set() };
    map[cat].valorTotal += r.valor;
    map[cat].fornecedores.add(r.fornecedor);
    map[cat].notas.add(r.nf);
  });
  return Object.values(map).map(c => ({
    categoria: c.categoria,
    valorTotal: c.valorTotal,
    qtdFornecedores: c.fornecedores.size,
    qtdNotas: c.notas.size,
  })).sort((a,b) => b.valorTotal - a.valorTotal);
}

function diasSemComprar(ultimaCompra){
  if(!ultimaCompra || !dataReferencia) return null;
  return Math.round((dataReferencia.getTime() - ultimaCompra.getTime()) / 86400000);
}

function badgeAlerta(ultimaCompra){
  const dias = diasSemComprar(ultimaCompra);
  if(dias === null || dias < 60) return '';
  return `<span class="badge alerta">⚠ ${dias}d sem comprar</span>`;
}

function render(){
  const f = getFilters();
  const rowsFiltradas = rawRows.filter(r => matchesFilters(r, f));

  const resumoGeralFornecedor = resumoPorFornecedor(rowsFiltradas);
  let categorias = resumoPorCategoria(rowsFiltradas);

  if(f.busca){
    const catsComMatch = new Set(
      resumoGeralFornecedor.filter(r => r.fornecedor.toLowerCase().includes(f.busca)).map(r => r.categoria || 'Sem categoria')
    );
    categorias = categorias.filter(c => catsComMatch.has(c.categoria));
  }

  const valorTotalGeral = resumoGeralFornecedor.reduce((s,r)=>s+r.valorTotal,0);
  const qtdFornecedoresGeral = resumoGeralFornecedor.length;
  const qtdNotasGeral = resumoGeralFornecedor.reduce((s,r)=>s+r.qtdNotas,0);
  const mesesGeral = new Set(rowsFiltradas.filter(r=>r.ano&&r.mes).map(r=>r.ano+'-'+r.mes)).size;
  const mediaMensalGeral = mesesGeral ? valorTotalGeral/mesesGeral : null;

  let html = `<div class="kpi-row">
    <div class="card c-valor" style="animation-delay:0s">
      <div class="kpi-label">
        <svg class="kpi-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#0f2440" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        Valor Total
      </div>
      <div class="kpi-value valor-grande">R$ ${fmt(valorTotalGeral)}</div>
      <div class="kpi-sub">com os filtros ativos</div>
    </div>
    <div class="card c-fornecedores" style="animation-delay:0.08s">
      <div class="kpi-label">
        <svg class="kpi-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#1f8a5f" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>
        Fornecedores
      </div>
      <div class="kpi-value">${qtdFornecedoresGeral}</div>
      <div class="kpi-sub">nomes únicos</div>
    </div>
    <div class="card c-notas" style="animation-delay:0.16s">
      <div class="kpi-label">
        <svg class="kpi-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#d9a441" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2h13l3 3v17l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5V5a3 3 0 0 1 3-3Z"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>
        Notas Fiscais
      </div>
      <div class="kpi-value">${qtdNotasGeral}</div>
      <div class="kpi-sub">no período filtrado</div>
    </div>
    <div class="card c-ticket" style="animation-delay:0.24s">
      <div class="kpi-label">
        <svg class="kpi-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#5b7ba8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        Média Mensal
      </div>
      <div class="kpi-value">R$ ${fmt(mediaMensalGeral)}</div>
      <div class="kpi-sub">gasto médio por mês</div>
    </div>
  </div>`;

  // ---- Nível 1: Categorias (tabela + gráfico lado a lado) ----
  const todasAbertas = categorias.length>0 && categorias.every(c => categoriasAbertas.has(c.categoria));
  let catRows = '';
  categorias.forEach((c, i) => {
    const aberta = categoriasAbertas.has(c.categoria);
    const cor = CORES_CATEGORIA[i % CORES_CATEGORIA.length];
    catRows += `<tr class="click-row${aberta?' aberto':''}" onclick="toggleCategoria('${c.categoria.replace(/'/g,"\\'")}')">
      <td><span class="chevron${aberta?' aberto':''}">▶</span><span class="cat-dot" style="background:${cor}"></span>${c.categoria}</td>
      <td>${c.qtdFornecedores}</td>
      <td>${c.qtdNotas}</td>
      <td class="total">R$ ${fmt(c.valorTotal)}</td>
    </tr>`;
    if(aberta){
      catRows += `<tr><td colspan="4" style="padding:0; border-bottom:none;">${buildFornecedorSubTabela(c.categoria, rowsFiltradas, f)}</td></tr>`;
    }
  });

  const algumaAberta = categoriasAbertas.size > 0;

  html += `<section class="block">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h2 style="margin:0;">Categorias <span class="note" style="display:inline;">(clique para ver os fornecedores)</span></h2>
      <button class="btn-mini" onclick="toggleExpandirTudo(${JSON.stringify(categorias.map(c=>c.categoria))})">${todasAbertas ? 'Recolher todas' : 'Expandir todas'}</button>
    </div>
    <div class="${algumaAberta ? '' : 'categoria-layout'}">
      <div style="overflow-x:auto;">
        <table class="monthly">
          <thead><tr><th>Categoria</th><th>Fornecedores</th><th>Notas</th><th class="total">Valor Total</th></tr></thead>
          <tbody>${catRows || '<tr><td colspan="4" style="text-align:center;">Nenhuma categoria encontrada com esses filtros.</td></tr>'}</tbody>
        </table>
      </div>
      ${algumaAberta ? '' : '<div class="chart-box-cat"><canvas id="chartCategoria"></canvas></div>'}
    </div>
  </section>`;

  // ---- Ranking geral de fornecedores (independente da categoria aberta acima) ----
  let resumoRanking = resumoGeralFornecedor;
  if(f.busca){
    resumoRanking = resumoRanking.filter(r => r.fornecedor.toLowerCase().includes(f.busca));
  }

  let rankRows = '';
  resumoRanking.forEach(r => {
    const aberto = rankingAberto === r.fornecedor;
    rankRows += `<tr class="click-row${aberto?' aberto':''}" onclick="toggleRanking('${r.fornecedor.replace(/'/g,"\\'")}')">
      <td>${r.fornecedor}${badgeAlerta(r.ultimaCompra)}</td>
      <td><span class="badge">${r.categoria || '—'}</span></td>
      <td>${r.qtdNotas}</td>
      <td>${r.mediaMensal===null?'-':'R$ '+fmt(r.mediaMensal)}</td>
      <td>${fmtDate(r.ultimaCompra)}</td>
      <td class="total">R$ ${fmt(r.valorTotal)}</td>
    </tr>`;
    if(aberto){
      const notas = rowsFiltradas
        .filter(n => n.fornecedor === r.fornecedor)
        .sort((a,b) => (b.data?.getTime()||0) - (a.data?.getTime()||0));
      const notasRows = notas.map(n => `<tr>
          <td>${fmtDate(n.data)}</td>
          <td>${n.conta || '-'}</td>
          <td>${n.nf}</td>
          <td class="total">R$ ${fmt(n.valor)}</td>
        </tr>`).join('');
      rankRows += `<tr><td colspan="6" style="padding:0; border-bottom:none;">
        <div class="sub-block">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong style="color:var(--navy); font-size:0.85rem;">Notas fiscais — ${notas.length} encontrada(s)</strong>
            <span class="sub-close" onclick="event.stopPropagation(); rankingAberto=null; render();">Fechar</span>
          </div>
          <div style="max-height:300px; overflow-y:auto;">
          <table class="monthly">
            <thead><tr><th>Data</th><th>Conta Contábil</th><th>Nº NF</th><th class="total">Valor</th></tr></thead>
            <tbody>${notasRows || '<tr><td colspan="4" style="text-align:center;">Sem notas nesse filtro.</td></tr>'}</tbody>
          </table>
          </div>
        </div>
      </td></tr>`;
    }
  });

  html += `<section class="block">
    <h2>Ranking de Fornecedores <span class="note" style="display:inline;">(clique numa linha para ver as notas)</span></h2>
    <div class="ranking-layout">
      <div style="overflow-x:auto;">
        <table class="monthly">
          <thead><tr><th>Fornecedor</th><th>Categoria</th><th>Notas</th><th>Média Mensal</th><th>Última Compra</th><th class="total">Valor Total</th></tr></thead>
          <tbody>${rankRows || '<tr><td colspan="6" style="text-align:center;">Nenhum fornecedor encontrado com esses filtros.</td></tr>'}</tbody>
        </table>
      </div>
      <div class="chart-box-cat"><canvas id="chartRanking"></canvas></div>
    </div>
  </section>`;

  document.getElementById('content').innerHTML = html;
  if(document.getElementById('chartCategoria')){
    renderChartCategoria(categorias);
  } else if(charts.categoria){
    charts.categoria.destroy();
    charts.categoria = null;
  }
  renderChartRanking(resumoRanking);
}

function buildFornecedorSubTabela(categoria, rowsFiltradas, f){
  let rowsDaCategoria = rowsFiltradas.filter(r => (r.categoria || 'Sem categoria') === categoria);
  let resumo = resumoPorFornecedor(rowsDaCategoria);

  if(f.busca){
    resumo = resumo.filter(r => r.fornecedor.toLowerCase().includes(f.busca));
  }

  let rows = '';
  resumo.forEach(r => {
    const abertoF = fornecedorAberto === (categoria + '::' + r.fornecedor);
    rows += `<tr class="click-row${abertoF?' aberto':''}" onclick="event.stopPropagation(); toggleFornecedor('${categoria.replace(/'/g,"\\'")}','${r.fornecedor.replace(/'/g,"\\'")}')">
      <td>${r.fornecedor}${badgeAlerta(r.ultimaCompra)}</td>
      <td>${r.qtdNotas}</td>
      <td>${r.mediaMensal===null?'-':'R$ '+fmt(r.mediaMensal)}</td>
      <td>${fmtDate(r.ultimaCompra)}</td>
      <td class="total">R$ ${fmt(r.valorTotal)}</td>
    </tr>`;
    if(abertoF){
      const notas = rowsDaCategoria
        .filter(n => n.fornecedor === r.fornecedor)
        .sort((a,b) => (b.data?.getTime()||0) - (a.data?.getTime()||0));
      const notasRows = notas.map(n => `<tr>
          <td>${fmtDate(n.data)}</td>
          <td>${n.conta || '-'}</td>
          <td>${n.nf}</td>
          <td class="total">R$ ${fmt(n.valor)}</td>
        </tr>`).join('');
      rows += `<tr><td colspan="5" style="padding:0; border-bottom:none;">
        <div class="sub-block">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong style="color:var(--navy); font-size:0.85rem;">Notas fiscais — ${notas.length} encontrada(s)</strong>
            <span class="sub-close" onclick="event.stopPropagation(); fornecedorAberto=null; render();">Fechar</span>
          </div>
          <div style="max-height:300px; overflow-y:auto;">
          <table class="monthly">
            <thead><tr><th>Data</th><th>Conta Contábil</th><th>Nº NF</th><th class="total">Valor</th></tr></thead>
            <tbody>${notasRows || '<tr><td colspan="4" style="text-align:center;">Sem notas nesse filtro.</td></tr>'}</tbody>
          </table>
          </div>
        </div>
      </td></tr>`;
    }
  });

  return `<div class="sub-block">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <strong style="color:var(--navy); font-size:0.85rem;">Fornecedores em "${categoria}"</strong>
      <span class="sub-close" onclick="event.stopPropagation(); categoriaAberta=null; fornecedorAberto=null; render();">Fechar categoria</span>
    </div>
    <div style="overflow-x:auto;">
    <table class="monthly">
      <thead><tr><th>Fornecedor</th><th>Qtd Notas</th><th>Média Mensal</th><th>Última Compra</th><th class="total">Valor Total</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center;">Nenhum fornecedor encontrado.</td></tr>'}</tbody>
    </table>
    </div>
  </div>`;
}

function toggleCategoria(categoria){
  if(categoriasAbertas.has(categoria)) categoriasAbertas.delete(categoria);
  else categoriasAbertas.add(categoria);
  fornecedorAberto = null;
  render();
}

function toggleExpandirTudo(nomesCategorias){
  const todasAbertas = nomesCategorias.length>0 && nomesCategorias.every(c => categoriasAbertas.has(c));
  if(todasAbertas){ categoriasAbertas.clear(); }
  else { nomesCategorias.forEach(c => categoriasAbertas.add(c)); }
  fornecedorAberto = null;
  render();
}

function toggleFornecedor(categoria, fornecedor){
  const key = categoria + '::' + fornecedor;
  fornecedorAberto = (fornecedorAberto === key) ? null : key;
  render();
}

function toggleRanking(fornecedor){
  rankingAberto = (rankingAberto === fornecedor) ? null : fornecedor;
  render();
}

function renderChartRanking(resumo){
  const top10 = resumo.slice(0,10);
  const ctx = document.getElementById('chartRanking');
  if(charts.ranking) charts.ranking.destroy();
  charts.ranking = new Chart(ctx, {
    type:'bar',
    data:{
      labels: top10.map(r=>r.fornecedor.length>26 ? r.fornecedor.slice(0,26)+'…' : r.fornecedor),
      datasets:[{ data: top10.map(r=>r.valorTotal), backgroundColor:'#0f2440', borderRadius:4 }]
    },
    options:{
      indexAxis:'y',
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{ x:{ grid:{color:'#eef1f5'} }, y:{ grid:{display:false} } }
    }
  });
}

function renderChartCategoria(categorias){
  const ctx = document.getElementById('chartCategoria');
  if(charts.categoria) charts.categoria.destroy();
  charts.categoria = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels: categorias.map(c=>c.categoria),
      datasets:[{ data: categorias.map(c=>c.valorTotal), backgroundColor: categorias.map((c,i)=>CORES_CATEGORIA[i % CORES_CATEGORIA.length]) }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } } }
    }
  });
}

loadAll();
</script>
</body>
</html>
