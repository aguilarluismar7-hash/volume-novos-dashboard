<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso — Grupo Raviera</title>
<style>
  :root{
    --navy:#0f2440;
    --navy-2:#16345c;
    --bg:#f4f6f9;
    --card:#ffffff;
    --border:#e2e8f0;
    --red:#c8442d;
    --text:#1a2434;
    --muted:#6b7789;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:36px 32px;
    width:100%;
    max-width:360px;
    text-align:center;
  }
  img{height:48px; margin-bottom:16px;}
  h1{font-size:1.15rem; color:var(--navy); margin:0 0 6px;}
  p.sub{color:var(--muted); font-size:0.85rem; margin:0 0 22px;}
  input[type=password]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:0.95rem;
    margin-bottom:14px;
  }
  button{
    width:100%;
    padding:11px;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:8px;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
  }
  button:hover{background:var(--navy-2);}
  .erro{color:var(--red); font-size:0.85rem; margin-bottom:14px; display:none;}
</style>
</head>
<body>
  <div class="box">
    <img src="logosemfundo.png" alt="Grupo Raviera" onerror="this.style.display='none'">
    <h1>Acesso Restrito</h1>
    <p class="sub">Revisão Forecast - 2°Semestre</p>
    <div class="erro" id="erro">Senha incorreta. Tente novamente.</div>
    <form method="POST" action="/api/login">
      <input type="password" name="password" placeholder="Senha" required autofocus>
      <button type="submit">Entrar</button>
    </form>
  </div>
  <script>
    if(new URLSearchParams(location.search).get('erro')){
      document.getElementById('erro').style.display = 'block';
    }
  </script>
</body>
</html>
