<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pós-Vendas — Grupo Raviera</title>
<style>
  :root{
    --navy:#0f2440;
    --bg:#f4f6f9;
    --card:#ffffff;
    --border:#e2e8f0;
    --text:#1a2434;
    --muted:#6b7789;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    min-height:100vh;
  }
  .sidebar{
    width:200px;
    flex-shrink:0;
    background:var(--navy);
    padding:24px 16px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  .sidebar-logo img{height:34px; width:auto; object-fit:contain;}
  .sidebar-links{display:flex; flex-direction:column; gap:4px;}
  .sidebar-links a{
    color:#c3d0e2;
    text-decoration:none;
    padding:10px 12px;
    border-radius:8px;
    font-size:0.86rem;
    font-weight:600;
  }
  .sidebar-links a:hover{background:rgba(255,255,255,0.08); color:#fff;}
  .sidebar-links a.active{background:#fff; color:var(--navy);}
  .main{flex:1; min-width:0; padding:28px 32px 60px; display:flex; align-items:center; justify-content:center;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:48px;
    text-align:center;
    max-width:420px;
  }
  h1{color:var(--navy); font-size:1.3rem; margin:0 0 8px;}
  p{color:var(--muted); font-size:0.9rem;}
  @media (max-width:900px){
    body{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; align-items:center; overflow-x:auto; padding:12px 16px;}
    .sidebar-links{flex-direction:row;}
  }
</style>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo">
    <img src="logosemfundo.png" alt="Grupo Raviera" onerror="this.style.display='none'">
  </div>
  <div class="sidebar-links">
    <a href="/index.html">Novos</a>
    <a href="/usados.html">Usados</a>
    <a href="/pos-vendas.html" class="active">Pós-Vendas</a>
    <a href="/relatorio.html">DRE</a>
    <a href="/despesas.html">Despesas</a>
  </div>
</nav>
<div class="main">
  <div class="card">
    <h1>Em construção 🚧</h1>
    <p>O relatório de Pós-Vendas ainda está sendo montado. Volta aqui em breve.</p>
  </div>
</div>
</body>
</html>
