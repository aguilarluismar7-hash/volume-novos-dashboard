<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório Consolidado — Grupo Raviera</title>
<style>
  :root{
    --navy:#0f2440;
    --navy-2:#16345c;
    --slate:#5b6b82;
    --slate-light:#8fa0b8;
    --bg:#f4f6f9;
    --card:#ffffff;
    --border:#e2e8f0;
    --green:#1f8a5f;
    --red:#c8442d;
    --text:#1a2434;
    --muted:#6b7789;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    min-height:100vh;
  }
  .sidebar{
    width:200px;
    flex-shrink:0;
    background:var(--navy);
    padding:24px 16px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  .sidebar-logo img{height:34px; width:auto; object-fit:contain;}
  .sidebar-links{display:flex; flex-direction:column; gap:4px;}
  .sidebar-links a{
    color:#c3d0e2;
    text-decoration:none;
    padding:10px 12px;
    border-radius:8px;
    font-size:0.86rem;
    font-weight:600;
  }
  .sidebar-links a:hover{background:rgba(255,255,255,0.08); color:#fff;}
  .sidebar-links a.active{background:#fff; color:var(--navy);}
  .main{flex:1; min-width:0; padding:28px 32px 60px;}
  @media (max-width:900px){
    body{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; align-items:center; overflow-x:auto; padding:12px 16px;}
    .sidebar-links{flex-direction:row;}
  }
  .wrap{max-width:1280px;margin:0 auto;}
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:22px;
  }
  .titlebox{display:flex; align-items:center; gap:14px;}
  h1{
    font-size:1.55rem;
    font-weight:700;
    margin:0 0 4px;
    color:var(--navy);
    letter-spacing:-0.01em;
  }
  .subtitle{color:var(--muted);font-size:0.92rem;}
  .status{
    text-align:right;
    font-size:0.78rem;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .btn{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:7px 14px;
    border-radius:7px;
    font-size:0.8rem;
    cursor:pointer;
    font-weight:600;
    text-decoration:none;
    display:inline-block;
  }
  .btn:hover{background:var(--navy-2);}
  .btn.secondary{background:#fff; color:var(--navy); border:1px solid var(--border);}

  section.block{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px 22px;
    margin-bottom:16px;
    overflow-x:auto;
  }
  table.dre{
    width:100%;
    border-collapse:collapse;
    font-size:0.85rem;
    min-width:900px;
  }
  table.dre th, table.dre td{
    padding:8px 10px;
    text-align:right;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  table.dre th:first-child, table.dre td:first-child{
    text-align:left;
    min-width:260px;
    white-space:normal;
  }
  table.dre thead th{
    color:var(--muted);
    font-weight:700;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.03em;
    text-align:center;
  }
  table.dre thead th:first-child{text-align:left;}
  tr.parent-row{background:#eef2f7; cursor:pointer;}
  tr.parent-row td:first-child{font-weight:700; color:var(--navy);}
  tr.parent-row.no-children{cursor:default;}
  tr.child-row td:first-child{padding-left:34px; color:var(--slate);}
  tr.child-row{display:none;}
  tr.child-row.open{display:table-row;}
  .toggle{
    display:inline-block;
    width:16px;
    text-align:center;
    margin-right:8px;
    color:var(--slate);
    font-weight:700;
  }
  td.neg{color:var(--red);}
  .loading, .error{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .error{color:var(--red);}
  .note{font-size:0.78rem;color:var(--muted);margin-top:10px;line-height:1.5;}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo">
    <img src="logosemfundo.png" alt="Grupo Raviera" onerror="this.style.display='none'">
  </div>
  <div class="sidebar-links">
    <a href="/index.html">Novos</a>
    <a href="/usados.html">Usados</a>
    <a href="/pos-vendas.html">Pós-Vendas</a>
    <a href="/relatorio.html" class="active">DRE</a>
    <a href="/despesas.html">Despesas</a>
  </div>
</nav>
<div class="main">
<div class="wrap">
  <header>
    <div class="titlebox">
      <div>
        <h1>Relatório Consolidado</h1>
        <div class="subtitle">DRE por segmento — visão fechada do semestre</div>
      </div>
    </div>
    <div class="status">
      <span id="lastUpdated">Carregando…</span>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="loadAll()">Atualizar dados</button>
      </div>
    </div>
  </header>

  <div id="content">
    <div class="loading">Carregando dados da planilha…</div>
  </div>
</div>
</div>

<script>
// Ordem preferida de exibição das colunas — períodos fora dessa lista aparecem
// no final, na ordem em que forem encontrados na planilha.
const PERIODO_ORDEM = [
  'Realizado 1S 2025',
  'Realizado 2S 2025',
  'Realizado Ano 2025',
  'Realizado 1S 2026',
  'Budget 1S 2026',
  'Budget 2S 2026',
  'Forecast 2S 2026',
];

function csvUrl(sheetName){
  return `/api/sheet?tab=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
}

async function fetchSheet(name){
  const res = await fetch(csvUrl(name), { cache: 'no-store' });
  if(!res.ok) throw new Error(`Não consegui ler a aba "${name}" (status ${res.status})`);
  const text = await res.text();
  return parseCSV(text);
}

function findCol(headerRow, name){
  return headerRow.findIndex(h => (h||'').trim().toLowerCase() === name.toLowerCase());
}

// Interpreta tanto números "crus" (414830349.95, ponto decimal — o formato mais
// provável no export do Sheets) quanto formatados no padrão BR (1.234,56).
// Regra: se tiver vírgula, é formato BR (ponto = milhar). Sem vírgula, se o
// último ponto tiver exatamente 3 dígitos depois E existir mais de um ponto,
// trata como milhar; senão trata o ponto como decimal.
function toNumberSmart(v){
  if(v === undefined || v === null) return null;
  let s = String(v).trim();
  if(s === '') return null;
  if(s.includes(',')){
    s = s.replace(/\./g,'').replace(',', '.');
  } else {
    const dotCount = (s.match(/\./g) || []).length;
    if(dotCount > 1){
      s = s.replace(/\./g, '');
    }
    // dotCount === 1: mantém como decimal (ex: 414830349.95, -3158676.94)
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function fmtValor(n, isPercent){
  if(n === null || n === undefined) return '-';
  if(isPercent){
    return (n*100).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
  }
  const abs = Math.round(Math.abs(n)).toLocaleString('pt-BR');
  return n < 0 ? `(${abs})` : abs;
}

async function loadAll(){
  document.getElementById('content').innerHTML = '<div class="loading">Carregando dados da planilha…</div>';
  try{
    const dreRows = await fetchSheet('TabDRE');
    const header = dreRows[0] || [];
    const idx = {
      periodo: findCol(header, 'Periodo'),
      nivel1: findCol(header, 'Nível 1'),
      nivel2: findCol(header, 'Nível 2'),
      id: findCol(header, 'ID'),
      valor: findCol(header, 'Valor'),
    };
    if(Object.values(idx).some(i => i === -1)){
      throw new Error('Não encontrei todas as colunas esperadas (Periodo, Nível 1, Nível 2, ID, Valor) na aba TabDRE. Cabeçalho lido: ' + header.join(' | '));
    }

    const rows = dreRows.slice(1).map(r => ({
      periodo: (r[idx.periodo]||'').trim(),
      nivel1: (r[idx.nivel1]||'').trim(),
      nivel2: (r[idx.nivel2]||'').trim(),
      id: (r[idx.id]||'').trim(),
      valor: toNumberSmart(r[idx.valor]),
    })).filter(r => r.periodo && r.nivel1);

    render(rows);

    document.getElementById('lastUpdated').textContent =
      'Atualizado em ' + new Date().toLocaleString('pt-BR');
  } catch(err){
    document.getElementById('content').innerHTML =
      `<div class="error">Não consegui carregar o relatório.<br>${err.message}</div>`;
    document.getElementById('lastUpdated').textContent = 'Falha ao atualizar';
  }
}

function render(rows){
  // Ordem única de (Nível1, Nível2), na sequência em que aparecem na planilha
  const order = [];
  const seen = new Set();
  rows.forEach(r => {
    const key = r.nivel1 + '||' + r.nivel2;
    if(!seen.has(key)){ seen.add(key); order.push({nivel1:r.nivel1, nivel2:r.nivel2, key}); }
  });

  // Valores por chave e por período
  const values = {};
  rows.forEach(r => {
    const key = r.nivel1 + '||' + r.nivel2;
    values[key] = values[key] || {};
    values[key][r.periodo] = r.valor;
  });

  // Remove linhas "lixo" (Nível2 vazio e nenhum valor em nenhum período)
  const clean = order.filter(o => {
    if(o.nivel2 !== '') return true;
    const vals = values[o.key] || {};
    return Object.values(vals).some(v => v !== null);
  });

  // Agrupa por Nível 1
  const blocks = [];
  const blockByNivel1 = {};
  clean.forEach(o => {
    if(!blockByNivel1[o.nivel1]){
      const block = {nivel1:o.nivel1, parentKey:null, children:[]};
      blockByNivel1[o.nivel1] = block;
      blocks.push(block);
    }
    const block = blockByNivel1[o.nivel1];
    if(o.nivel2 === 'Total'){
      block.parentKey = o.key;
    } else {
      block.children.push(o);
    }
  });

  // Períodos presentes, na ordem preferida + extras no final
  const periodsPresent = new Set(rows.map(r => r.periodo));
  const periods = PERIODO_ORDEM.filter(p => periodsPresent.has(p))
    .concat([...periodsPresent].filter(p => !PERIODO_ORDEM.includes(p)));

  const cell = (val, isPercent) => {
    const cls = (val !== null && val < 0) ? ' class="neg"' : '';
    return `<td${cls}>${fmtValor(val, isPercent)}</td>`;
  };

  let bodyHtml = '';
  blocks.forEach((block, i) => {
    const isPercent = block.nivel1.toLowerCase().startsWith('margem');
    const parentVals = block.parentKey ? (values[block.parentKey] || {}) : {};
    const hasChildren = block.children.length > 0;
    const groupId = `g${i}`;
    const toggleIcon = hasChildren ? '<span class="toggle">▸</span>' : '<span class="toggle"></span>';
    const rowClass = hasChildren ? 'parent-row' : 'parent-row no-children';
    const onclick = hasChildren ? ` onclick="toggleGroup('${groupId}', this)"` : '';

    bodyHtml += `<tr class="${rowClass}"${onclick}><td>${toggleIcon}${block.nivel1}</td>` +
      periods.map(p => cell(parentVals[p] !== undefined ? parentVals[p] : null, isPercent)).join('') +
      `</tr>`;

    block.children.forEach(child => {
      const vals = values[child.key] || {};
      bodyHtml += `<tr class="child-row" data-group="${groupId}"><td>${child.nivel2}</td>` +
        periods.map(p => cell(vals[p] !== undefined ? vals[p] : null, isPercent)).join('') +
        `</tr>`;
    });
  });

  const headHtml = `<th></th>` + periods.map(p => `<th>${p}</th>`).join('');

  document.getElementById('content').innerHTML = `
    <section class="block">
      <table class="dre">
        <thead><tr>${headHtml}</tr></thead>
        <tbody>${bodyHtml}</tbody>
      </table>
      <div class="note">Clique numa linha em destaque para abrir/fechar as contas de Nível 2. Valores negativos aparecem entre parênteses.</div>
    </section>
  `;
}

function toggleGroup(groupId, headerRow){
  const rows = document.querySelectorAll(`tr[data-group="${groupId}"]`);
  const icon = headerRow.querySelector('.toggle');
  const willOpen = !rows[0]?.classList.contains('open');
  rows.forEach(r => r.classList.toggle('open', willOpen));
  if(icon) icon.textContent = willOpen ? '▾' : '▸';
}

loadAll();
</script>
</body>
</html>
