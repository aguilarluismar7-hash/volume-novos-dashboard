<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório Consolidado — Grupo Raviera</title>
<link rel="stylesheet" href="/shared.css">
<style>
  .wrap{max-width:1280px;margin:0 auto;}
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:22px;
  }
  .titlebox{display:flex; align-items:center; gap:14px;}
  h1{
    font-size:1.55rem;
    font-weight:700;
    margin:0 0 4px;
    color:var(--navy);
    letter-spacing:-0.01em;
  }
  .subtitle{color:var(--muted);font-size:0.92rem;}
  .status{
    text-align:right;
    font-size:0.78rem;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .btn{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:7px 14px;
    border-radius:7px;
    font-size:0.8rem;
    cursor:pointer;
    font-weight:600;
    text-decoration:none;
    display:inline-block;
  }
  .btn:hover{background:var(--navy-2);}
  .btn.secondary{background:#fff; color:var(--navy); border:1px solid var(--border);}

  section.block{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px 22px;
    margin-bottom:16px;
    overflow-x:auto;
  }
  table.dre{
    width:100%;
    border-collapse:collapse;
    font-size:0.85rem;
    min-width:900px;
  }
  table.dre th, table.dre td{
    padding:8px 10px;
    text-align:right;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  table.dre th:first-child, table.dre td:first-child{
    text-align:left;
    min-width:260px;
    white-space:normal;
  }
  table.dre .col-indicador{text-align:center;}
  .cresc-pos{color:#2f8f5b;}
  .cresc-neg{color:#c25b4a;}
  .bar-wrap{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .bar-track{
    width:48px;
    height:5px;
    background:#e2e8f0;
    border-radius:3px;
    overflow:hidden;
    display:block;
  }
  .bar-fill{
    display:block;
    height:100%;
    background:#3b82f6;
    border-radius:3px;
  }
  table.dre thead th{
    color:var(--muted);
    font-weight:700;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.03em;
    text-align:right;
  }
  table.dre thead th:first-child{text-align:left;}
  tr.parent-row{background:#fafbfc; cursor:pointer;}
  tr.parent-row td:first-child{font-weight:700; color:var(--navy);}
  tr.parent-row.no-children{cursor:default;}
  tr.child-row{display:none; background:#f7f8fa;}
  tr.child-row td:first-child{padding-left:34px; color:var(--slate); border-left:2px solid var(--border);}
  tr.child-row.open{display:table-row;}

  /* Cores por tipo de linha, identificadas pelo ID Gerencial (mais confiável que o texto) */
  tr.row-subtotal{background:#d3e2f4;}
  tr.row-subtotal td:first-child{color:var(--navy);}
  tr.row-total-resultado{background:#a9c6e8;}
  tr.row-total-resultado td:first-child{color:var(--navy);}
  tr.row-consolidador{background:var(--navy-2);}
  tr.row-consolidador td{color:#fff;}
  tr.row-consolidador td:first-child{color:#fff;}
  tr.row-ebitda{background:#6b7789;}
  tr.row-ebitda td{color:#fff;}
  tr.row-ebitda td:first-child{color:#fff;}
  tr.row-resultado-loja{background:#1a2434;}
  tr.row-resultado-loja td{color:#fff;}
  tr.row-resultado-loja td:first-child{color:#fff;}
  tr.row-margem{background:#e6e8eb;}
  tr.row-margem td:first-child{color:var(--slate); font-style:italic;}
  tr.row-margem td{font-style:italic;}

  .toggle{
    display:inline-block;
    width:16px;
    text-align:center;
    margin-right:8px;
    color:var(--slate);
    font-weight:700;
  }
  /* Negativos ficam só entre parênteses, sem cor — evita poluição visual */
  .loading, .error{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .error{color:var(--red);}
  .note{font-size:0.78rem;color:var(--muted);margin-top:10px;line-height:1.5;}
</style>
</head>
<body>
<nav class="sidebar" id="sidebar-root"></nav>
<script src="/sidebar.js"></script>
<div class="main">
<div class="wrap">
  <header>
    <div class="titlebox">
      <div>
        <h1>Relatório Consolidado</h1>
        <div class="subtitle">DRE por segmento — visão fechada do semestre</div>
      </div>
    </div>
    <div class="status">
      <span id="lastUpdated">Carregando…</span>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="loadAll()">Atualizar dados</button>
      </div>
    </div>
  </header>

  <div style="margin-bottom:16px; display:flex; gap:10px; align-items:center;">
    <label style="font-size:0.72rem; font-weight:700; color:var(--slate); text-transform:uppercase; letter-spacing:0.03em;">Semestre</label>
    <select id="fSemestre" onchange="renderTable()" style="padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:0.85rem; background:#fff; color:var(--text);">
      <option value="S1">1° Semestre</option>
      <option value="S2">2° Semestre</option>
      <option value="ANO">Ano (1°+2° Semestre)</option>
    </select>
  </div>

  <div id="content">
    <div class="loading">Carregando dados da planilha…</div>
  </div>
</div>
</div>

<script>
// Mapeia cada "tipo" de valor pro nome exato do período em cada semestre.
// "Ano" nunca é um período próprio — é sempre 1S + 2S somados (só quando os dois existem).
const PERIOD_MAP = {
  real2025: { S1: 'Realizado 1S 2025', S2: 'Realizado 2S 2025' },
  real2026: { S1: 'Realizado 1S 2026', S2: 'Realizado 2S 2026' },
  budget:   { S1: 'Budget 1S 2026',    S2: 'Budget 2S 2026' },
};

function getValue(values, key, semestre, type, isPercent){
  const vals = values[key] || {};
  const map = PERIOD_MAP[type];
  if(semestre === 'ANO'){
    if(isPercent) return undefined; // somar % não faz sentido, precisa vir calculado à parte
    const v1 = vals[map.S1], v2 = vals[map.S2];
    if(v1 !== undefined && v2 !== undefined) return v1 + v2;
    if(v1 !== undefined) return v1;
    if(v2 !== undefined) return v2;
    return undefined;
  }
  return vals[map[semestre]];
}

function csvUrl(sheetName){
  return `/api/sheet?tab=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
}

async function fetchSheet(name){
  const res = await fetch(csvUrl(name), { cache: 'no-store' });
  if(!res.ok) throw new Error(`Não consegui ler a aba "${name}" (status ${res.status})`);
  const text = await res.text();
  return parseCSV(text);
}

function findCol(headerRow, name){
  return headerRow.findIndex(h => (h||'').trim().toLowerCase() === name.toLowerCase());
}

// Interpreta tanto números "crus" (414830349.95, ponto decimal — o formato mais
// provável no export do Sheets) quanto formatados no padrão BR (1.234,56).
// Regra: se tiver vírgula, é formato BR (ponto = milhar). Sem vírgula, se o
// último ponto tiver exatamente 3 dígitos depois E existir mais de um ponto,
// trata como milhar; senão trata o ponto como decimal.
function toNumberSmart(v){
  if(v === undefined || v === null) return null;
  let s = String(v).trim();
  if(s === '') return null;
  if(s.includes(',')){
    s = s.replace(/\./g,'').replace(',', '.');
  } else {
    const dotCount = (s.match(/\./g) || []).length;
    if(dotCount > 1){
      s = s.replace(/\./g, '');
    }
    // dotCount === 1: mantém como decimal (ex: 414830349.95, -3158676.94)
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function fmtValor(n, isPercent){
  if(n === null || n === undefined) return '-';
  if(isPercent){
    // Se o valor já vier como percentual "cru" (ex: 6.5) não multiplica; se vier
    // como fração (ex: 0.065) multiplica por 100. Detecta pela magnitude.
    const pct = Math.abs(n) < 1 ? n * 100 : n;
    return pct.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
  }
  const abs = Math.round(Math.abs(n)).toLocaleString('pt-BR');
  return n < 0 ? `(${abs})` : abs;
}

let currentRows = [];

async function loadAll(){
  document.getElementById('content').innerHTML = '<div class="loading">Carregando dados da planilha…</div>';
  try{
    const dreRows = await fetchSheet('TabDRE');

    // Procura a linha de cabeçalho em qualquer posição (robusto a linhas em
    // branco ou de título antes dela), em vez de assumir que é sempre a linha 1.
    const headerRowIndex = dreRows.findIndex(r =>
      r.some(cell => (cell||'').trim().toLowerCase() === 'periodo')
    );
    if(headerRowIndex === -1){
      throw new Error('Não encontrei uma linha de cabeçalho contendo "Periodo" na aba TabDRE. Confira se essa coluna existe e está escrita assim.');
    }
    const header = dreRows[headerRowIndex];
    const idx = {
      periodo: findCol(header, 'Periodo'),
      nivel1: findCol(header, 'Nível 1'),
      nivel2: findCol(header, 'Nível 2'),
      id: findCol(header, 'ID'),
      valor: findCol(header, 'Valor'),
    };
    if(Object.values(idx).some(i => i === -1)){
      throw new Error('Não encontrei todas as colunas esperadas (Periodo, Nível 1, Nível 2, ID, Valor) na aba TabDRE. Cabeçalho lido: ' + header.join(' | '));
    }

    currentRows = dreRows.slice(headerRowIndex + 1).map(r => ({
      periodo: (r[idx.periodo]||'').trim(),
      nivel1: (r[idx.nivel1]||'').trim(),
      nivel2: (r[idx.nivel2]||'').trim(),
      id: (r[idx.id]||'').trim(),
      valor: toNumberSmart(r[idx.valor]),
    })).filter(r => r.periodo && r.nivel1);

    renderTable();

    document.getElementById('lastUpdated').textContent =
      'Atualizado em ' + new Date().toLocaleString('pt-BR');
  } catch(err){
    document.getElementById('content').innerHTML =
      `<div class="error">Não consegui carregar o relatório.<br>${err.message}</div>`;
    document.getElementById('lastUpdated').textContent = 'Falha ao atualizar';
  }
}

// Classifica linhas de Totalizador/Margem pelo ID Gerencial (mais confiável que o texto)
const ID_ROW_CLASS = {
  '9901': 'row-subtotal',           // Subtotal V.N.
  '9902': 'row-total-resultado',    // Total Resultado V.N.
  '9903': 'row-total-resultado',    // Total Resultado V.U.
  '9904': 'row-total-resultado',    // Total Resultado P&A
  '9905': 'row-total-resultado',    // Total Resultado Oficina
  '9906': 'row-consolidador',       // Faturamento Líquido
  '9907': 'row-consolidador',       // Custos Operacionais Totais
  '9908': 'row-consolidador',       // Resultado Operacional Líquido
  '9910': 'row-ebitda',             // EBITDA
  '9911': 'row-resultado-loja',     // Resultado da Loja
  '8802': 'row-margem',             // Margem V.N.
  '8803': 'row-margem',             // Margem V.U.
  '8804': 'row-margem',             // Margem P&A
  '8805': 'row-margem',             // Margem Oficina
};

function renderTable(){
  const rows = currentRows;
  const semestre = document.getElementById('fSemestre').value;

  // Ordem única de (Nível1, Nível2), na sequência em que aparecem na planilha
  const order = [];
  const seen = new Set();
  rows.forEach(r => {
    const key = r.nivel1 + '||' + r.nivel2;
    if(!seen.has(key)){ seen.add(key); order.push({nivel1:r.nivel1, nivel2:r.nivel2, key}); }
  });

  // Valores por chave e por período, e o ID (pra classificação de cor)
  const values = {};
  const idByKey = {};
  rows.forEach(r => {
    const key = r.nivel1 + '||' + r.nivel2;
    values[key] = values[key] || {};
    values[key][r.periodo] = r.valor;
    if(r.id && !idByKey[key]) idByKey[key] = r.id;
  });

  // Remove linhas "lixo" (Nível2 vazio e nenhum valor em nenhum período)
  const clean = order.filter(o => {
    if(o.nivel2 !== '') return true;
    const vals = values[o.key] || {};
    return Object.values(vals).some(v => v !== null);
  });

  // Agrupa por Nível 1
  const blocks = [];
  const blockByNivel1 = {};
  clean.forEach(o => {
    if(!blockByNivel1[o.nivel1]){
      const block = {nivel1:o.nivel1, parentKey:null, children:[]};
      blockByNivel1[o.nivel1] = block;
      blocks.push(block);
    }
    const block = blockByNivel1[o.nivel1];
    if(o.nivel2 === 'Total'){
      block.parentKey = o.key;
    } else {
      block.children.push(o);
    }
  });

  const cell = (val, isPercent) => {
    const cls = (val !== null && val !== undefined && val < 0) ? ' class="neg"' : '';
    return `<td${cls}>${fmtValor(val, isPercent)}</td>`;
  };

  const atingCell = (real2026, budget, skip) => {
    if(skip) return '<td class="col-indicador">-</td>';
    if(real2026 === undefined || budget === undefined || !budget) return '<td class="col-indicador">-</td>';
    const pct = (real2026 / budget) * 100;
    const width = Math.max(0, Math.min(100, pct));
    const texto = pct.toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%';
    return `<td class="col-indicador">
      <div class="bar-wrap">
        <span>${texto}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${width}%"></span></span>
      </div>
    </td>`;
  };

  const crescCell = (real2026, real2025, skip) => {
    if(skip) return '<td class="col-indicador">-</td>';
    if(real2026 === undefined || real2025 === undefined || !real2025) return '<td class="col-indicador">-</td>';
    const pct = ((real2026 - real2025) / Math.abs(real2025)) * 100;
    const texto = (pct>=0?'+':'') + pct.toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%';
    const cls = pct >= 0 ? 'cresc-pos' : 'cresc-neg';
    return `<td class="col-indicador ${cls}">${texto}</td>`;
  };

  const rowValues = (key, isPercent) => ({
    v2025: getValue(values, key, semestre, 'real2025', isPercent),
    v2026: getValue(values, key, semestre, 'real2026', isPercent),
    vBudget: getValue(values, key, semestre, 'budget', isPercent),
  });

  let bodyHtml = '';
  blocks.forEach((block, i) => {
    const isPercent = block.nivel1.toLowerCase().startsWith('margem');
    const hasChildren = block.children.length > 0;
    const groupId = `g${i}`;
    const toggleIcon = hasChildren ? '<span class="toggle">▸</span>' : '<span class="toggle"></span>';
    const colorClass = block.parentKey ? (ID_ROW_CLASS[idByKey[block.parentKey]] || '') : '';
    const rowClass = ['parent-row', hasChildren ? '' : 'no-children', colorClass].filter(Boolean).join(' ');
    const onclick = hasChildren ? ` onclick="toggleGroup('${groupId}', this)"` : '';
    // Totalizadores/Subtotais/Consolidadores já têm cor própria — a barrinha só
    // aparece nas contas "normais" (sem classificação), pra não empilhar cor.
    const skipIndicator = !!colorClass;

    const v = block.parentKey ? rowValues(block.parentKey, isPercent) : {v2025:undefined, v2026:undefined, vBudget:undefined};

    bodyHtml += `<tr class="${rowClass}"${onclick}><td>${toggleIcon}${block.nivel1}</td>` +
      cell(v.v2025 !== undefined ? v.v2025 : null, isPercent) +
      cell(v.v2026 !== undefined ? v.v2026 : null, isPercent) +
      cell(v.vBudget !== undefined ? v.vBudget : null, isPercent) +
      atingCell(v.v2026, v.vBudget, isPercent || skipIndicator) +
      crescCell(v.v2026, v.v2025, isPercent || skipIndicator) +
      `</tr>`;

    block.children.forEach(child => {
      const cv = rowValues(child.key, isPercent);
      bodyHtml += `<tr class="child-row" data-group="${groupId}"><td>${child.nivel2}</td>` +
        cell(cv.v2025 !== undefined ? cv.v2025 : null, isPercent) +
        cell(cv.v2026 !== undefined ? cv.v2026 : null, isPercent) +
        cell(cv.vBudget !== undefined ? cv.vBudget : null, isPercent) +
        atingCell(cv.v2026, cv.vBudget, isPercent) +
        crescCell(cv.v2026, cv.v2025, isPercent) +
        `</tr>`;
    });
  });

  const semestreLabel = semestre === 'S1' ? '1° Semestre' : semestre === 'S2' ? '2° Semestre' : 'Ano (1°+2° Semestre)';

  document.getElementById('content').innerHTML = `
    <section class="block">
      <table class="dre">
        <thead><tr><th></th><th>2025</th><th>2026</th><th>Budget</th><th class="col-indicador">Ating.</th><th class="col-indicador">Cresc.</th></tr></thead>
        <tbody>${bodyHtml}</tbody>
      </table>
      <div class="note">Visão: ${semestreLabel}. Clique numa linha em destaque para abrir/fechar as contas de Nível 2. Valores negativos aparecem entre parênteses.<br>Ating. = 2026 ÷ Budget. Cresc. = 2026 vs 2025. "Ano" soma 1°+2° Semestre quando os dois existem; se só um existir, mostra esse valor.</div>
    </section>
  `;
}

function toggleGroup(groupId, headerRow){
  const rows = document.querySelectorAll(`tr[data-group="${groupId}"]`);
  const icon = headerRow.querySelector('.toggle');
  const willOpen = !rows[0]?.classList.contains('open');
  rows.forEach(r => r.classList.toggle('open', willOpen));
  if(icon) icon.textContent = willOpen ? '▾' : '▸';
}

loadAll();
</script>
</body>
</html>
